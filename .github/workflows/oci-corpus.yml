name: OCI corpus consumer

on:
  push:
    branches: [main]
    paths:
      - 'tests/corpus/**'
      - 'tests/oci-corpus/**'
      - 'cl-stack.asd'
      - '.github/workflows/oci-corpus.yml'
  pull_request:
    paths:
      - 'tests/corpus/**'
      - 'tests/oci-corpus/**'
      - 'cl-stack.asd'
      - '.github/workflows/oci-corpus.yml'
  workflow_dispatch:

concurrency:
  group: cl-stack-oci-corpus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumer:
    uses: egao1980/cl-repository/.github/workflows/test-system.yml@main
    with:
      system: cl-stack/oci-corpus
      os-json: '["ubuntu-latest"]'
    permissions:
      contents: read
      packages: read
