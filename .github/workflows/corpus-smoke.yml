name: Corpus smoke

on:
  push:
    branches: [main]
    paths:
      - 'tests/corpus/**'
      - 'tests/corpus-smoke/**'
      - 'cl-stack.asd'
      - 'qlfile'
      - '.github/workflows/corpus-smoke.yml'
  pull_request:
    paths:
      - 'tests/corpus/**'
      - 'tests/corpus-smoke/**'
      - 'cl-stack.asd'
      - 'qlfile'
      - '.github/workflows/corpus-smoke.yml'

jobs:
  smoke:
    uses: egao1980/cl-repository/.github/workflows/test-system.yml@main
    with:
      system: cl-stack/corpus-smoke
      os-json: '["ubuntu-latest"]'
    permissions:
      contents: read
      packages: read
